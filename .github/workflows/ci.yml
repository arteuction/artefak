name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# ── Shared helpers ──────────────────────────────────────────────────────────
# Both jobs use the same MariaDB image/options and PHP setup, extracted here
# as YAML anchors to keep the file DRY and the two jobs truly identical in
# their infrastructure (prevents "works in test, breaks in upgrade-path").

jobs:
  # ── Job 1: full test suite on a fresh DB ───────────────────────────────────
  test:
    name: PHP 8.3 · MariaDB 11 · tests
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: arteuction_test
          MARIADB_USER: arteuction_test
          MARIADB_PASSWORD: arteuction_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot --silent"
          --health-interval=3s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, gd, zip, bcmath, intl, pdo_mysql, mysqli, pcntl
          ini-values: memory_limit=512M, max_execution_time=60, default_charset=UTF-8
          coverage: none
          tools: composer:v2

      # ── Wait for MariaDB ──────────────────────────────────────────────────
      # The Docker health check marks the container ready, but TCP may still
      # be initialising.  This loop gives it a deterministic extra gate.
      - name: Wait for MariaDB
        run: |
          echo "Waiting for MariaDB to accept connections..."
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent 2>/dev/null; then
              echo "  ready after ${i} attempt(s)."
              break
            fi
            echo "  attempt $i/30 — sleeping 2 s"
            sleep 2
          done
          mysqladmin ping -h127.0.0.1 -uroot -proot --silent \
            || (echo "ERROR: MariaDB did not accept connections within 60 s" && exit 1)

      # ── Lock test user to test DB only ───────────────────────────────────
      - name: Restrict DB user to arteuction_test.*
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'arteuction_test'@'%';
            GRANT ALL PRIVILEGES ON arteuction_test.* TO 'arteuction_test'@'%';
            FLUSH PRIVILEGES;"

      # ── Composer ─────────────────────────────────────────────────────────
      # Cache key on composer.json (not lock) because we run `composer update`
      # which regenerates the lock file on every run.
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-php83-${{ hashFiles('composer.json') }}
          restore-keys: composer-php83-

      - name: composer update
        run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_CAFILE: /etc/ssl/certs/ca-certificates.crt

      - name: composer validate
        run: composer validate

      # ── Laravel environment ───────────────────────────────────────────────
      - name: Prepare .env files
        run: |
          cp .env.example .env
          cp .env.testing.example .env.testing
          php artisan key:generate
          php artisan key:generate --env=testing
          php artisan config:clear --env=testing

      # ── Sanity-check the DB connection before migrations ──────────────────
      - name: Verify DB connection
        run: |
          php artisan tinker --env=testing --execute="
            \$pdo = DB::connection()->getPdo();
            echo 'Connected: ' . \$pdo->getAttribute(PDO::ATTR_SERVER_VERSION) . PHP_EOL;
          "

      - name: migrate:fresh
        run: php artisan migrate:fresh --force --env=testing

      - name: Run test suite
        run: php artisan test --env=testing

      - name: composer audit
        run: composer audit

  # ── Job 2: forward upgrade path (migration 012 backfill) ───────────────────
  upgrade-path:
    name: PHP 8.3 · MariaDB 11 · upgrade path
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: arteuction_test
          MARIADB_USER: arteuction_test
          MARIADB_PASSWORD: arteuction_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot --silent"
          --health-interval=3s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, gd, zip, bcmath, intl, pdo_mysql, mysqli, pcntl
          ini-values: memory_limit=512M, max_execution_time=60, default_charset=UTF-8
          coverage: none
          tools: composer:v2

      - name: Wait for MariaDB
        run: |
          echo "Waiting for MariaDB to accept connections..."
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent 2>/dev/null; then
              echo "  ready after ${i} attempt(s)."
              break
            fi
            echo "  attempt $i/30 — sleeping 2 s"
            sleep 2
          done
          mysqladmin ping -h127.0.0.1 -uroot -proot --silent \
            || (echo "ERROR: MariaDB did not accept connections within 60 s" && exit 1)

      - name: Restrict DB user to arteuction_test.*
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'arteuction_test'@'%';
            GRANT ALL PRIVILEGES ON arteuction_test.* TO 'arteuction_test'@'%';
            FLUSH PRIVILEGES;"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-php83-${{ hashFiles('composer.json') }}
          restore-keys: composer-php83-

      - name: composer update
        run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_CAFILE: /etc/ssl/certs/ca-certificates.crt

      - name: Prepare .env files
        run: |
          cp .env.example .env
          cp .env.testing.example .env.testing
          php artisan key:generate
          php artisan key:generate --env=testing

      - name: Run migrations 001–011 (exclude 012)
        run: |
          for f in $(ls database/migrations/2026_08_07_00000[1-9]_*.php \
                        database/migrations/2026_08_07_000010_*.php \
                        database/migrations/2026_08_07_000011_*.php | sort); do
            php artisan migrate --force --env=testing --path="$f"
          done

      - name: Seed ledger credits (simulates pre-012 rows without idempotency_key)
        run: |
          mysql -h127.0.0.1 -uarteuction_test -parteuction_test arteuction_test -e "
            INSERT INTO settlements
              (stripe_payment_intent_id, stripe_event_id, gross_cents, currency,
               profile_key, profile_version,
               artist_bps, fund_bps, ops_bps,
               artist_cents, fund_cents, ops_cents,
               status, created_at, updated_at)
            VALUES
              ('pi_seed', 'evt_seed', 10000, 'EUR',
               'social_pilot_45_45_10', 1,
               4500, 4500, 1000,
               4500, 4500, 1000,
               'completed', NOW(), NOW());
            SET @sid = LAST_INSERT_ID();
            INSERT INTO settlement_lines
              (settlement_id, recipient_type, amount_cents, currency, weight, status, created_at, updated_at)
            VALUES
              (@sid, 'artist', 4500, 'EUR', 1, 'pending', NOW(), NOW()),
              (@sid, 'fund',   4500, 'EUR', 1, 'pending', NOW(), NOW()),
              (@sid, 'ops',    1000, 'EUR', 1, 'pending', NOW(), NOW());
            INSERT INTO ledger_entries
              (settlement_id, settlement_line_id, type, amount_cents, currency, note, created_at, updated_at)
            SELECT @sid, id, 'credit', amount_cents, currency, 'Sale split', NOW(), NOW()
            FROM settlement_lines WHERE settlement_id = @sid;
          "
          COUNT=$(mysql -h127.0.0.1 -uarteuction_test -parteuction_test arteuction_test \
            -sNe "SELECT COUNT(*) FROM ledger_entries")
          echo "Seeded $COUNT ledger credit rows (no idempotency_key column yet)"
          [ "$COUNT" -eq 3 ] || (echo "FAIL: expected 3 rows, got $COUNT" && exit 1)

      - name: Assert ledger rows exist before migration 012
        run: |
          COUNT=$(mysql -h127.0.0.1 -uarteuction_test -parteuction_test arteuction_test \
            -sNe "SELECT COUNT(*) FROM ledger_entries")
          echo "Ledger rows before migration 012: $COUNT"
          [ "$COUNT" -gt 0 ] || (echo "FAIL: expected seeded rows" && exit 1)

      - name: Run migration 012
        run: |
          php artisan migrate --force --env=testing \
            --path=database/migrations/2026_08_07_000012_ledger_entries_add_idempotency_key.php

      - name: Assert every ledger row has a non-null idempotency_key
        run: |
          NULL_COUNT=$(mysql -h127.0.0.1 -uarteuction_test -parteuction_test arteuction_test \
            -sNe "SELECT COUNT(*) FROM ledger_entries WHERE idempotency_key IS NULL OR idempotency_key = ''")
          TOTAL=$(mysql -h127.0.0.1 -uarteuction_test -parteuction_test arteuction_test \
            -sNe "SELECT COUNT(*) FROM ledger_entries")
          echo "ledger_entries: total=$TOTAL, null_key=$NULL_COUNT"
          [ "$NULL_COUNT" -eq 0 ] || (echo "FAIL: $NULL_COUNT rows still have NULL idempotency_key" && exit 1)
          [ "$TOTAL" -gt 0 ]      || (echo "FAIL: no ledger rows found" && exit 1)
          echo "PASS: all $TOTAL ledger rows backfilled correctly"

      - name: Assert UNIQUE constraint is enforced after migration 012
        run: |
          mysql -h127.0.0.1 -uarteuction_test -parteuction_test arteuction_test -e "
            SET @existing = (SELECT idempotency_key FROM ledger_entries LIMIT 1);
            SET @sid = (SELECT settlement_id FROM ledger_entries LIMIT 1);
            SET @lid = (SELECT settlement_line_id FROM ledger_entries LIMIT 1);
            INSERT INTO ledger_entries
              (settlement_id, settlement_line_id, type, amount_cents, currency, idempotency_key, created_at, updated_at)
            VALUES
              (@sid, @lid, 'credit', 1, 'EUR', @existing, NOW(), NOW());
          " 2>&1 | grep -q "Duplicate entry" \
            && echo "PASS: duplicate idempotency_key correctly rejected" \
            || (echo "FAIL: duplicate key was accepted — UNIQUE constraint missing" && exit 1)
