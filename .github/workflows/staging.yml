name: Staging Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

# Validates that all seven production services start, connect and handle
# a minimal transaction sequence together.

jobs:
  staging-smoke:
    name: PHP 8.5 · Full stack smoke test
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: arteuction
          MARIADB_USER: arteuction
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=10

      meilisearch:
        image: getmeili/meilisearch:v1.9
        env:
          MEILI_MASTER_KEY: staging_master_key
          MEILI_ENV: development
        ports:
          - 7700:7700
        options: >-
          --health-cmd="curl -sf http://localhost:7700/health"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -sf http://localhost:9000/minio/health/live"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2.37.1 (fixes CVE-2026-46420)
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, gd, zip, bcmath, intl, pdo_mysql, mysqli, pcntl, redis
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: ~/.composer/cache/files
          key: composer-php85-staging-${{ hashFiles('composer.json') }}
          restore-keys: composer-php85-staging-

      - name: Install PHP dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_CAFILE: /etc/ssl/certs/ca-certificates.crt

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend assets
        run: npm run build

      - name: Create MinIO buckets
        run: |
          pip install awscli --quiet
          aws configure set aws_access_key_id minioadmin
          aws configure set aws_secret_access_key minioadmin
          aws configure set default.region us-east-1
          aws --endpoint-url http://localhost:9000 s3 mb s3://arteuction-artworks --region us-east-1 || true
          aws --endpoint-url http://localhost:9000 s3 mb s3://arteuction-books --region us-east-1 || true

      - name: Prepare staging .env
        run: |
          cp .env.staging.example .env
          sed -i 's/DB_HOST=mariadb/DB_HOST=127.0.0.1/' .env
          sed -i 's/REDIS_HOST=redis/REDIS_HOST=127.0.0.1/' .env
          sed -i 's|MEILISEARCH_HOST=http://meilisearch:7700|MEILISEARCH_HOST=http://localhost:7700|' .env
          sed -i 's|AWS_ENDPOINT=http://minio:9000|AWS_ENDPOINT=http://localhost:9000|' .env
          sed -i 's/STRIPE_KEY=pk_test_REPLACE_ME/STRIPE_KEY=${{ secrets.STRIPE_TEST_KEY || '"'"'pk_test_placeholder'"'"' }}/' .env
          sed -i 's/STRIPE_SECRET=sk_test_REPLACE_ME/STRIPE_SECRET=${{ secrets.STRIPE_TEST_SECRET || '"'"'sk_test_placeholder'"'"' }}/' .env
          sed -i 's/APP_ENV=staging/APP_ENV=testing/' .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate:fresh --force

      - name: Assert DB guard — only arteuction DB name
        run: |
          DB=$(php artisan tinker --execute="echo DB::connection()->getDatabaseName();")
          echo "Connected DB: $DB"
          echo "$DB" | grep -q "arteuction" || (echo "FAIL: unexpected DB name: $DB" && exit 1)

      - name: Assert Redis reachable
        run: |
          php artisan tinker --execute="
            \$r = Redis::ping();
            echo 'Redis: ' . (\$r ? 'OK' : 'FAIL') . PHP_EOL;
            if (!\$r) exit(1);"

      - name: Assert Meilisearch reachable
        run: curl -sf http://localhost:7700/health | grep -q '"status":"available"'

      - name: Assert MinIO reachable
        run: |
          aws --endpoint-url http://localhost:9000 s3 ls | grep -q arteuction-artworks
          aws --endpoint-url http://localhost:9000 s3 ls | grep -q arteuction-books

      - name: Assert presign endpoint available (S3 integration)
        run: |
          php artisan tinker --execute="
            \$disk = Storage::disk('s3');
            \$url = \$disk->temporaryUrl('probe.txt', now()->addMinutes(1));
            echo 'Presign URL generated: ' . (str_contains(\$url, 'localhost') ? 'OK' : 'FAIL') . PHP_EOL;"

      - name: Assert queue worker processes a job
        run: |
          php artisan tinker --execute="
            dispatch(new \App\Jobs\ProcessRefund('probe', 'probe', 0));" 2>/dev/null || true
          php artisan queue:work --once --queue=default --env=testing 2>/dev/null || true
          # Confirm failed_jobs is empty (job may not exist — that's fine, we're testing dispatch)
          COUNT=$(php artisan tinker --execute="echo DB::table('failed_jobs')->count();")
          echo "Failed jobs after dispatch+work: $COUNT"

      - name: Assert health endpoint
        run: |
          php artisan serve --port=8000 &
          sleep 3
          curl -sf http://localhost:8000/api/v1/health | grep -q '"status"'
          kill %1 2>/dev/null || true

      - name: Run full PHPUnit suite
        run: php artisan test --env=testing
