; /etc/php/8.4/cli/conf.d/99-arteuction.ini (copy also to fpm/conf.d/ if using PHP-FPM fallback)
; Tuned for 1GB VPS with FrankenPHP Octane

; ── Memory ────────────────────────────────────────────────────────────────────
; Per-script limit (not total; FrankenPHP workers each get this)
memory_limit = 256M

; ── OPcache ───────────────────────────────────────────────────────────────────
opcache.enable = 1
opcache.memory_consumption = 128       ; 128MB is enough for Laravel 13; raise to 192 if cache_full=true
opcache.max_accelerated_files = 10000
opcache.interned_strings_buffer = 16
opcache.revalidate_freq = 0            ; production: never revalidate (deploy clears via opcache_reset())
opcache.validate_timestamps = 0        ; production: skip stat() calls on every request
opcache.save_comments = 1              ; required for Laravel attribute parsing
opcache.fast_shutdown = 1

; JIT disabled: Laravel is I/O-bound; JIT saves nothing and costs 64-128MB jit_buffer_size
opcache.jit = 0

; ── Execution ─────────────────────────────────────────────────────────────────
max_execution_time = 30
upload_max_filesize = 20M
post_max_size = 21M
max_input_time = 30

; ── Error handling ────────────────────────────────────────────────────────────
display_errors = Off
log_errors = On
error_log = /var/log/arteuction/php-error.log
