; /etc/php/8.4/cli/conf.d/99-arteuction.ini (copy also to fpm/conf.d/ if using PHP-FPM fallback)
; Tuned for 1GB VPS with FrankenPHP Octane

; ── Memory ────────────────────────────────────────────────────────────────────
; Per-script limit. With FrankenPHP worker mode, each worker process holds this
; budget for the lifetime of a request. Heavy operations (PDF, ZIP, CSV import,
; GDPR export) should run as queue jobs with their own higher limit override,
; not as inline HTTP requests that exhaust the worker budget.
memory_limit = 96M

; PHP 8.5 only: hard ceiling — prevents ini_set('memory_limit', '-1') in any script.
; Uncomment once PHP 8.5 is confirmed in production (euction.artefak.eu currently runs 8.4).
; max_memory_limit = 128M

; ── OPcache ───────────────────────────────────────────────────────────────────
opcache.enable = 1
; Start at 96MB. Monitor with opcache_get_status(): if cache_full=true, raise to 112 or 128.
; Raising it is the right fix — a full cache causes re-compilation, which costs more than the MB saved.
opcache.memory_consumption = 96
; 20000 covers the full vendor/ tree. Confirm with: find . -name "*.php" | wc -l
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 8
opcache.revalidate_freq = 0            ; production: never revalidate (deploy clears via opcache_reset())
opcache.validate_timestamps = 0        ; production: skip stat() calls on every request
opcache.save_comments = 1              ; required for Laravel attribute parsing
opcache.fast_shutdown = 1

; JIT disabled: Laravel is I/O-bound; JIT saves nothing and costs 64-128MB jit_buffer_size
opcache.jit = 0

; ── Execution ─────────────────────────────────────────────────────────────────
max_execution_time = 30
upload_max_filesize = 20M
post_max_size = 21M
max_input_time = 30

; ── Error handling ────────────────────────────────────────────────────────────
display_errors = Off
log_errors = On
error_log = /var/log/arteuction/php-error.log
