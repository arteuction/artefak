# /etc/sysctl.d/99-arteuction.conf
# Kernel memory tuning for 1GB VPS running Laravel + MariaDB

# Prefer to keep anonymous memory in RAM, swap only when necessary
vm.swappiness = 10

# Less aggressive reclaim of inode/dentry caches
vm.vfs_cache_pressure = 50

# Conservative overcommit: commit limit = swap + 80% of RAM
# With 2GB swap + 1GB RAM: commit limit ≈ 2.8GB
# Prevents silent OOM kills by failing allocations early with ENOMEM
vm.overcommit_memory = 2
vm.overcommit_ratio = 80

# Reduce dirty page write-back latency (good for NVMe)
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
