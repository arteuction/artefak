; deploy/php-fpm.conf
; Profile A alternative: PHP-FPM ondemand — for A/B comparison with FrankenPHP Octane.
;
; Use this to answer: does keeping Laravel bootstrapped in Octane worker mode
; save enough memory vs. the per-request cold-start cost to justify the complexity?
;
; How to activate on the VPS:
;   1. Install: apt install php8.4-fpm
;   2. Copy to: /etc/php/8.4/fpm/pool.d/arteuction.conf
;   3. Stop arteuction-octane: systemctl stop arteuction-octane
;   4. Start PHP-FPM: systemctl start php8.4-fpm
;   5. Switch Caddyfile to php_fastcgi instead of php_server (see comment below)
;   6. Measure idle + peak RSS: systemctl show php8.4-fpm -p MemoryCurrent,MemoryPeak
;   7. Restore Octane and compare
;
; Caddyfile change for this profile — replace php_server block with:
;   php_fastcgi unix//run/php/php8.4-fpm.sock

[arteuction]
user  = arteuction
group = arteuction

listen = /run/php/php8.4-fpm-arteuction.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; ondemand: zero workers at idle — best for 1GB when traffic is sporadic.
; Workers are created on demand and released after pm.process_idle_timeout.
; Cold-start adds ~50-100ms per fresh request (Laravel bootstrap).
; Compare this against Octane's constant memory hold to decide which profile wins.
pm                   = ondemand
pm.max_children      = 2          ; at most 2 simultaneous PHP processes
pm.process_idle_timeout = 10s     ; release worker after 10s idle
pm.max_requests      = 200        ; recycle worker after 200 requests (memory leak guard)

; Logging
php_admin_value[error_log]   = /var/log/arteuction/php-fpm-error.log
php_admin_flag[log_errors]   = on

; Override memory_limit for this pool (same as php.ini baseline)
php_admin_value[memory_limit] = 96M

; Document root — FastCGI needs to know where to find scripts
chdir = /var/www/arteuction
